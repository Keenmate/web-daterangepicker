<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — rolling selector layout</title>
    <link rel="stylesheet" href="test-fixtures.css">
    <style>
        web-daterangepicker { display: block; max-width: 320px; }
    </style>
</head>
<body>
    <h1>rolling selector layout</h1>
    <p>Targeted by <code>e2e/rolling-selector.spec.ts</code>.</p>

    <div class="fixture">
        <div class="fixture-label">single picker, default options</div>
        <web-daterangepicker id="picker" selection-mode="single" placeholder="YYYY-MM-DD"></web-daterangepicker>
    </div>

    <div class="fixture">
        <div class="fixture-label">min-date="2026-03-10" max-date="2027-08-20"</div>
        <web-daterangepicker id="minmax" selection-mode="single" initial-date="2026-06-15"
            min-date="2026-03-10" max-date="2027-08-20"></web-daterangepicker>
    </div>

    <div class="fixture">
        <div class="fixture-label">rolling-year-range="-1:+2" (relative form from the input's description)</div>
        <web-daterangepicker id="relative" selection-mode="single" initial-date="2026-06-15"
            rolling-year-range="-1:+2"></web-daterangepicker>
    </div>

    <div class="fixture">
        <div class="fixture-label">rolling-year-range="2024-2025", changed at runtime by the spec</div>
        <web-daterangepicker id="runtime-range" selection-mode="single" initial-date="2025-06-15"
            rolling-year-range="2024-2025"></web-daterangepicker>
    </div>

    <script type="module" src="/src/index.ts"></script>
</body>
</html>
