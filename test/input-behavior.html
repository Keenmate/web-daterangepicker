<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — input mask &amp; format</title>
    <link rel="stylesheet" href="test-fixtures.css">
    <style>
        web-daterangepicker { display: block; max-width: 320px; }
    </style>
</head>
<body>
    <h1>input mask &amp; format</h1>
    <p>Targeted by <code>e2e/input-behavior.spec.ts</code>.</p>

    <div class="fixture">
        <div class="fixture-label">default YYYY-MM-DD format, manual trigger so typing doesn't open</div>
        <web-daterangepicker id="iso" selection-mode="single"
            calendar-open-trigger="manual"></web-daterangepicker>
    </div>

    <div class="fixture">
        <div class="fixture-label">custom DD.MM.YYYY format</div>
        <web-daterangepicker id="eu" selection-mode="single"
            date-format-mask="DD.MM.YYYY"
            calendar-open-trigger="manual"></web-daterangepicker>
    </div>

    <div class="fixture">
        <div class="fixture-label">range mode — start and end separated by " - "</div>
        <web-daterangepicker id="range" selection-mode="range"
            calendar-open-trigger="manual"></web-daterangepicker>
    </div>

    <div class="fixture">
        <div class="fixture-label">progressive parsing — opens on focus at June 2026; typed segments move the calendar</div>
        <web-daterangepicker id="progressive" selection-mode="single" initial-date="2026-06-15"></web-daterangepicker>
    </div>

    <script>
        // The system clipboard is never touched: the paste specs dispatch a synthetic
        // ClipboardEvent, and the Clipboard API is stubbed so nothing can reach it.
        Object.defineProperty(navigator, 'clipboard', {
            configurable: true,
            value: { writeText: () => Promise.resolve(), readText: () => Promise.resolve('') },
        });
        window.__paste = (input, text) => {
            const data = new DataTransfer();
            data.setData('text/plain', text);
            const event = new ClipboardEvent('paste', { clipboardData: data, bubbles: true, cancelable: true });
            input.dispatchEvent(event);
            return event.defaultPrevented;
        };
    </script>
    <script type="module" src="/src/index.ts"></script>
</body>
</html>
