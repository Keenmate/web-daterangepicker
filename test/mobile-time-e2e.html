<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- width=device-width is required for phone classification (see mobile-presentation.html). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Test — mobile (full-screen) time picker</title>
    <link rel="stylesheet" href="test-fixtures.css">
</head>
<body>
    <h1>mobile time picker</h1>
    <p>Targeted by <code>e2e/mobile-time.spec.ts</code> (iPhone 13 emulation:
       <code>mobile-presentation="auto"</code> resolves to the full-screen sheet).</p>

    <web-daterangepicker id="time" picker-mode="time" placeholder="HH:mm"></web-daterangepicker>
    <web-daterangepicker id="datetime" picker-mode="datetime" initial-date="2026-06-15"
        placeholder="YYYY-MM-DD HH:mm"></web-daterangepicker>
    <web-daterangepicker id="wheel" picker-mode="time" time-display="wheel" placeholder="HH:mm"></web-daterangepicker>

    <script type="module" src="/src/index.ts"></script>
</body>
</html>
